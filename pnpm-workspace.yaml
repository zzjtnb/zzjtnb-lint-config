  # 工作台代码与差异编辑器的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  modern-monaco: ^0.4.2
  # 应用构建脚本串并行调度的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  npm-run-all2: ^9.0.4
  # Vue 工作区状态管理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  pinia: ^4.1.0
  # 样式语法树与插件处理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  postcss: ^8.5.32
  # HTML 与 Vue 样式容器解析的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  postcss-html: ^2.0.0
  # Vue SCSS 上游预设所需的 Sass 语法解析器；随配置包提供。
  postcss-scss: ^4.0.9
  # 无样式且可访问的 Vue 交互原语的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  reka-ui: ^2.11.0
  # SCSS 编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  sass-embedded: ^1.106.1
  # 版本范围与兼容性比较的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  semver: ^7.8.5
  # 只读配置与代码片段高亮的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  shiki: ^4.5.0
  # CSS、SCSS 与 Vue 样式检查引擎的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint: ^17.16.0
  # Vue 上游预设要求的 HTML 容器配置。
  stylelint-config-html: ^2.0.0
  # CSS 属性排序预设的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
