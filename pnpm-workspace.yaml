  # 包版本交互管理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  bumpp: ^12.3.0
  # 图表计算和 SVG 渲染的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
