  jsdom: ^30.1.3
  # Markdownlint 测试读取带注释的公开 JSONC 规则，不依赖编译器 API。
  jsonc-parser: ^3.3.1
  # Markdown 检查 CLI 及其公开转导出 API的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
