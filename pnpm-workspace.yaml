# 批量更新时始终排除 TypeScript，包括 pnpm up -L；版本升级需单独处理。
# CI/Cloudflare 环境下禁用 minimumReleaseAge 缓冲（默认 1440 分钟/1天），避免锁文件中刚发布的依赖拦截构建。
minimumReleaseAge: 0

update:
  ignoreDeps:
    - typescript
    - '@typescript/native'

packages:
  - apps/*
  - packages/*
  - internal/*
  - internal/packages/*
  - internal/packages/@core/*/*
  - internal/lint-configs/*
  - playground
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@changesets/git': ^4.0.1
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
  '@eslint/config-inspector': ^3.5.0
  '@iconify/utils': ^3.1.7
  '@intlify/unplugin-vue-i18n': ^11.2.7
  '@jspm/generator': ^2.17.0
  '@manypkg/get-packages': ^3.1.0
