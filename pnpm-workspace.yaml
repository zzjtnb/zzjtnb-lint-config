  # 自定义规则夹具复用引擎正式类型，仅用于开发测试。
  markdownlint: ^0.42.1
  # Markdown 检查 CLI 及其公开转导出 API的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  markdownlint-cli2: ^0.24.0
  # 工作台代码与差异编辑器的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  modern-monaco: ^0.4.2
  # 应用构建脚本串并行调度的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  npm-run-all2: ^9.0.4
  # Vue 工作区状态管理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  pinia: ^4.1.0
  # 样式语法树与插件处理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  postcss: ^8.5.32
  # HTML 与 Vue 样式容器解析的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  postcss-html: ^2.0.0
  # Vue SCSS 上游预设所需的 Sass 语法解析器；随配置包提供。
  postcss-scss: ^4.0.9
  # 无样式且可访问的 Vue 交互原语的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  reka-ui: ^2.11.0
  # SCSS 编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  sass-embedded: ^1.108.1
  # 版本范围与兼容性比较的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  semver: ^7.8.6
  # 只读配置与代码片段高亮的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  shiki: ^4.6.0
  # CSS、SCSS 与 Vue 样式检查引擎的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint: ^18.0.0
  # Vue 上游预设要求的 HTML 容器配置。
  stylelint-config-html: ^2.0.0
  # CSS 属性排序预设的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint-config-recess-order: ^7.10.0
  # Vue 上游预设要求的基础推荐规则配置。
  stylelint-config-recommended: ^19.0.0
  # SCSS 官方推荐规则的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint-config-recommended-scss: ^17.0.1
  # Vue 样式容器推荐配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint-config-recommended-vue: ^2.0.0
  # CSS 标准规则预设的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint-config-standard: ^41.0.0
  # Stylelint 属性排序插件的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  stylelint-order: ^8.1.3
  # 公开包与沙箱资源构建的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  tsdown: ^0.23.7
  # 工作区任务依赖图和缓存的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  turbo: ^2.11.10
  # 默认 TypeScript 编译器的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  typescript: ^7.0.2
  # 原子样式、reset 与图标生成的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  unocss: ^66.12.0
  # 按 Resolver 自动导入 Vue 组件的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  unplugin-vue-components: ^32.1.0
  # 应用开发服务与生产打包的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  vite: ^8.3.6
  # Vue 本地开发调试面板的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
