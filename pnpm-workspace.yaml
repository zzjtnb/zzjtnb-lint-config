# CI/Cloudflare 环境下禁用 minimumReleaseAge 缓冲（默认 1440 分钟/1天），避免锁文件中刚发布的依赖拦截构建。
minimumReleaseAge: 0
# 沿用上游：清理失效的发布时长豁免项，不设置依赖信任策略。
minimumReleaseAgeExcludePrune: true

# --latest 会越过 catalog 的现有范围，以下兼容敏感工具改为单独维护。
update:
  # 按依赖名排除批量升级，对默认与命名 catalog 都生效，不影响其他依赖正常升级。
  ignoreDeps:
    - typescript

# 沿用上游：使用跨平台 Shell 模拟器运行脚本。
shellEmulator: true

# 声明工作区项目路径；未匹配目录不会作为 pnpm 工作区参与依赖链接。
packages:
  - apps/*
  - packages/*
  - internal/testing
  - playground
  - docs
  - scripts

# 仅允许列出的依赖执行安装构建脚本，不放开全部第三方生命周期。
allowBuilds:
  # 允许文件监听器安装平台适配产物。
  '@parcel/watcher': true
  # 允许安装脚本准备对应平台的 esbuild 可执行文件。
  esbuild: true

# 默认目录：catalog: 与 catalog:default 均引用这里；默认编译器范围保持最新正式版。
catalog:
  # 上游 ESLint 配置工厂与语言集成的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@antfu/eslint-config': ^10.0.0
  # ESLint Flat Config 文件匹配与合并的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@eslint/config-array': ^0.23.5
  # 本地 Lucide SVG 图标集合的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@iconify-json/lucide': ^1.2.148
  # Iconify 本地图标读取与转换的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@iconify/utils': ^3.1.7
  # 真实浏览器 E2E 测试的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@playwright/test': ^1.64.1
  # shadcn 组件规则插件的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@shadcn/lint': ^0.2.3
  # Node.js 24 编译器基础配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@tsconfig/node24': ^24.0.5
  # jsdom 类型声明的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@types/jsdom': ^30.0.0
  # Node.js 类型声明的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@types/node': ^26.6.5
  # antfu 的 UnoCSS 集成插件；仅在 unocss 选项开启时加载。
  '@unocss/eslint-plugin': ^66.12.0
  # Wind4 原子样式预设的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@unocss/preset-wind4': ^66.12.0
  # Vue 单文件组件编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vitejs/plugin-vue': ^6.0.10
  # Vue JSX 编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vitejs/plugin-vue-jsx': ^5.1.6
  # Vue 组件测试工具的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vue/test-utils': ^2.5.1
  # Vue 官方编译器基础配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vue/tsconfig': ^0.9.1
  # 浏览器 Node.js 沙箱 SDK的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
