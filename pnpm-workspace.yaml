  # Vue 图表组件的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  vue-echarts: ^8.3.2
  # 工作台 Hash 路由的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  vue-router: ^5.4.0
  # Vue 单文件组件类型检查的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  vue-tsc: ^3.3.13

# 命名目录与默认目录都由本文件统一维护，并非第二套分散版本源。
# 仅为真实兼容范围保留例外；catalog 本身不冻结版本，升级时核对命令作用范围。
catalogs:
  # packages/eslint 的运行时，以及 docs/、playground/、internal/testing/ 的工具 API 共用 TS6。
  typescript6:
    # TS6 兼容范围；消费方通过 catalog:typescript6 引用，不回退到默认 TS7 目录。
    typescript: ^6.0.3
