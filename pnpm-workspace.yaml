# 命名目录与默认目录都由本文件统一维护，并非第二套分散版本源。
# 仅为真实兼容范围保留例外；catalog 本身不冻结版本，升级时核对命令作用范围。
catalogs:
  # 按 typescript-eslint 的并存建议隔离经典 API；此 catalog 名称由本仓库自行约定。
  # packages/eslint 的解析器运行时与 internal/testing 的经典工具 API 使用 TS6。
  typescript6:
    # TS6 兼容范围；消费方通过 catalog:typescript6 引用，不回退到默认 TS7 目录。
    typescript: ^6.0.3
