# CI/Cloudflare 环境下禁用 minimumReleaseAge 缓冲（默认 1440 分钟/1天），避免锁文件中刚发布的依赖拦截构建。
minimumReleaseAge: 0
# 沿用上游：清理失效的发布时长豁免项，不设置依赖信任策略。
minimumReleaseAgeExcludePrune: true

# --latest 会越过 catalog 的现有范围，以下兼容敏感工具改为单独维护。
update:
  # 按依赖名排除批量升级，对默认与命名 catalog 都生效，不影响其他依赖正常升级。
  ignoreDeps:
    - typescript

# 升级到 pnpm >=12.19.0 并核对正式文档后启用，避免跨工作区复用未声明的可选 peer。
# projectScopedOptionalPeers: true
# 启用后重新安装；移除下面两条 Volar 例外，确认其 TS7 告警消失且构建、类型检查和测试通过。
# 上游文档：https://github.com/pnpm/pnpm/blob/main/pnpm/docs/settings/peer-dependencies.md#projectscopedoptionalpeers

# 限定 peer 告警例外，具体范围与原因在各项维护。
peerDependencyRules:
  allowedVersions:
    # 纯 TS 的 tsgo 构建未启用 Vue/Volar；仅忽略可选 peer 复用产生的当前版本告警，不声明 TS7 兼容。
    '@volar/language-service@2.4.30>typescript': 7.0.2
    '@volar/typescript@2.4.30>typescript': 7.0.2
    # 仅补充当前 Vue TS 配置与 TS 6.0.3 bridge 系列的已验证关系。
    '@vue/tsconfig@0.9.1>typescript': '>=6.0.3-bridge.0 <6.0.4-0'
    # 仅补充当前编辑器与同一 bridge 系列的已验证关系，不放开其他替代包或主版本。
    modern-monaco@0.4.2>typescript: '>=6.0.3-bridge.0 <6.0.4-0'
    # 当前默认配置与消费样例已验证；仅忽略以下版本的 Stylelint 18 peer 告警，不承诺所有可选规则兼容。
    stylelint-config-recess-order@7.10.0>stylelint: 18.0.0
    stylelint-config-recommended-scss@17.0.1>stylelint: 18.0.0
    stylelint-config-recommended@18.0.0>stylelint: 18.0.0
    stylelint-scss@7.4.0>stylelint: 18.0.0

# 沿用上游：使用跨平台 Shell 模拟器运行脚本。
shellEmulator: true

# 声明工作区项目路径；未匹配目录不会作为 pnpm 工作区参与依赖链接。
packages:
  - apps/*
  - packages/*
  - internal/testing
  - playground
  - docs
  - scripts

# Vue 工作区保留默认编译器声明，安装时使用维护者推荐的 TS7 桥接包；不影响公开包的编译器。
overrides:
  '@zzjtnb/docs>typescript': npm:typescript-native-bridge@latest
  '@zzjtnb/playground>typescript': npm:typescript-native-bridge@latest

# 仅允许列出的依赖执行安装构建脚本，不放开全部第三方生命周期。
allowBuilds:
  # 允许文件监听器安装平台适配产物。
  '@parcel/watcher': true
  # 允许安装脚本准备对应平台的 esbuild 可执行文件。
  esbuild: true

# 默认目录：catalog: 与 catalog:default 均引用这里；默认编译器范围保持最新正式版。
catalog:
  # 上游 ESLint 配置工厂与语言集成的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@antfu/eslint-config': ^10.0.0
  # ESLint Flat Config 文件匹配与合并的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@eslint/config-array': ^0.23.5
  # 本地 Lucide SVG 图标集合的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@iconify-json/lucide': ^1.2.152
  # Iconify 本地图标读取与转换的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@iconify/utils': ^3.1.7
  # 真实浏览器 E2E 测试的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@playwright/test': ^1.65.0
  # shadcn 组件规则插件的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@shadcn/lint': ^0.2.5
  # Node.js 24 编译器基础配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@tsconfig/node24': ^24.0.5
  # jsdom 类型声明的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@types/jsdom': ^30.0.0
  # Node.js 类型声明的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@types/node': ^26.6.6
  # 工程测试使用 semver 正式类型，不复制库接口。
  '@types/semver': ^7.8.0
  # command 插件的必需 peer，由共享 ESLint 包提供并在包内使用经典 TypeScript API。
  '@typescript-eslint/typescript-estree': ^8.72.1
  # command 插件的规则辅助 API，与配置包的 TypeScript 6 依赖上下文一致。
  '@typescript-eslint/utils': ^8.72.1
  # antfu 的 UnoCSS 集成插件；仅在 unocss 选项开启时加载。
  '@unocss/eslint-plugin': ^66.12.0
  # Wind4 原子样式预设的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@unocss/preset-wind4': ^66.12.0
  # Vue 单文件组件编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vitejs/plugin-vue': ^6.0.10
  # Vue JSX 编译的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vitejs/plugin-vue-jsx': ^5.1.6
  # Vue 组件测试工具的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vue/test-utils': ^2.5.1
  # Vue 官方编译器基础配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@vue/tsconfig': ^0.9.1
  # 浏览器 Node.js 沙箱 SDK的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@webcontainer/api': 1.6.4
  # 终端面板尺寸适配的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@xterm/addon-fit': ^0.11.0
  # 工作台 Console 终端显示的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  '@xterm/xterm': ^6.0.0
  # JavaScript 配置表达式解析的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  acorn: ^8.19.0
  # 包版本交互管理的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  bumpp: ^12.3.0
  # 图表计算和 SVG 渲染的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  echarts: ^6.1.0
  # JavaScript 与 TypeScript 检查引擎的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  eslint: ^10.14.0
  # 保留 antfu 的 Composer 链式接口与嵌套配置状态。
  eslint-flat-config-utils: ^3.2.0
  # antfu 的外部格式化集成插件；仅在 formatters 选项开启时加载。
  eslint-plugin-format: ^2.0.1
  # antfu 的 antislop 集成依赖，使用上游维护的规则子集。
  eslint-plugin-slop: ^0.1.3
  # antfu 的 antislop 复杂度与重复逻辑检测依赖。
  eslint-plugin-sonarjs: ^4.2.2
  # antfu 的 Vue 无障碍集成插件；仅在 vue.a11y 选项开启时加载。
  eslint-plugin-vuejs-accessibility: ^2.6.3
  # 文档 front matter 读取的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  gray-matter: ^4.0.3
  # Node.js 下加载 TypeScript 配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  jiti: ^2.7.0
  # Vue 单元测试 DOM 环境的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
