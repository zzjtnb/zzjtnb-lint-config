  # 文档 front matter 读取的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
  gray-matter: ^4.0.3
  # Node.js 下加载 TypeScript 配置的版本范围；消费方通过 catalog: 引用，不在各包重复版本号。
